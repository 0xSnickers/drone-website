# 宿主机 Nginx 1.28 反向代理与网关限流配置
# 部署位置：/etc/nginx/sites-available/drone-website.conf

# 网关级防刷限流：保护监控上报与登录接口
limit_req_zone $binary_remote_addr zone=drone_ingest_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=drone_auth_limit:10m rate=5r/s;

# 后端 upstream（多机高可用时追加备用节点，自动按 max_fails 故障摘流）
upstream drone_server_upstream {
    server 127.0.0.1:9000 max_fails=2 fail_timeout=5s;
    # server 10.0.1.12:9000 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

upstream drone_web_upstream {
    server 127.0.0.1:5173 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

upstream drone_admin_upstream {
    server 127.0.0.1:5174 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

# 1. 前台无人机展示站：example.com
server {
    listen 80;
    server_name example.com;

    client_max_body_size 2m;
    limit_req_status 429;

    # 存活与就绪探针位于 /api/health 与 /api/ready（不带 /v1 前缀）
    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://drone_server_upstream/api/health;
    }

    location = /api/ready {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://drone_server_upstream/api/ready;
    }

    location ~ ^/api/(v1/)?(admin/)?auth/ {
        limit_req zone=drone_auth_limit burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(v1/)?(.*)$ /api/v1/$2 break;
        proxy_pass http://drone_server_upstream;
    }

    location /api/v1/ingest/ {
        limit_req zone=drone_ingest_limit burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://drone_server_upstream/api/v1/ingest/;
        proxy_next_upstream error timeout;
    }

    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://drone_server_upstream/api/v1/;
        proxy_next_upstream error timeout;
    }

    location /api/ingest/ {
        limit_req zone=drone_ingest_limit burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://drone_server_upstream/api/v1/ingest/;
        proxy_next_upstream error timeout;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://drone_server_upstream/api/v1/;
        proxy_next_upstream error timeout;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://drone_web_upstream;
    }
}

