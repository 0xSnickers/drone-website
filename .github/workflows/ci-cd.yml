name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-sdk:
    name: CI · Monitor SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run check

  ci-web:
    name: CI · Web Storefront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_APP_NAME: AeroApex
      VITE_APP_ENV: production
      VITE_APP_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  ci-admin:
    name: CI · Admin Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VITE_APP_NAME: AeroApex 管理中心
      VITE_APP_ENV: production
      VITE_APP_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  ci-server:
    name: CI · Django Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - run: ./scripts/test.sh

  integration-e2e:
    name: E2E · Postgres 16 + Redis 7 + API Contract
    runs-on: ubuntu-latest
    needs: [ci-sdk, ci-web, ci-admin, ci-server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drone_website_server
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d drone_website_server"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Migrate, boot Gunicorn, run 24 contract tests & Redis worker E2E
        working-directory: server
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: "ci-e2e-secret-key"
          JWT_SECRET: "ci-e2e-jwt-secret-must-be-at-least-32-chars"
          DATABASE_URL: "postgresql://app:password@127.0.0.1:5432/drone_website_server"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          INGEST_MODE: "redis_queue"
          SEED_DEMO_USER: "true"
          SEED_DEMO_DATA: "true"
          LOG_FILE: ""
        run: |
          uv sync --frozen
          uv run python manage.py migrate --noinput
          uv run gunicorn config.wsgi:application \
            --bind 127.0.0.1:9000 \
            --workers 2 \
            --threads 2 \
            --daemon \
            --pid /tmp/gunicorn-ci.pid

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9000/api/ready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/api/ready

          # 1. Run full 24-case API contract test suite against live Postgres 16
          BASE_URL=http://127.0.0.1:9000 node scripts/contract-test.mjs

          # 2. Verify async Redis ingest queue + run_ingest_worker end-to-end
          curl -fsS -X POST http://127.0.0.1:9000/api/v1/ingest/events \
            -H "Content-Type: application/json" \
            -d '{"appKey":"pk_demo_web","events":[{"type":"pageview","url":"https://aeroapex.com/flagship"}]}'
          uv run python manage.py run_ingest_worker --once

          kill "$(cat /tmp/gunicorn-ci.pid)" || true

  cd-publish-and-deploy:
    name: CD · Build GHCR Images & Auto Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [integration-e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image prefix and release tag
        id: meta
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-8)"
          echo "prefix=ghcr.io/${OWNER_LC}/drone-website" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-server:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.prefix }}-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/web.Dockerfile
          push: true
          build-args: |
            VITE_APP_ENV=production
            VITE_APP_RELEASE=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-web:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.prefix }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/admin.Dockerfile
          push: true
          build-args: |
            VITE_APP_ENV=production
            VITE_APP_RELEASE=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-admin:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.prefix }}-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Trigger remote SSH server deployment (when DEPLOY_SSH_HOST is configured)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "GHCR images published successfully (${{ steps.meta.outputs.sha }})."
            echo "Tip: Configure DEPLOY_SSH_HOST, DEPLOY_SSH_USER, and DEPLOY_SSH_KEY in Repository Secrets to enable automatic SSH rollout to your target host."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT_ARG="${DEPLOY_SSH_PORT:-22}"
          TARGET_DIR="${DEPLOY_PATH:-/srv/drone-website/work}"

          ssh -i ~/.ssh/deploy_key -p "$PORT_ARG" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "cd '${TARGET_DIR}' && git fetch origin main && git reset --hard origin/main && \
             export VITE_APP_RELEASE='${{ steps.meta.outputs.sha }}' && \
             docker compose -f docker-compose.prod.yml build && \
             docker compose -f docker-compose.prod.yml up -d postgres && \
             docker compose -f docker-compose.prod.yml run --rm server migrate && \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
             for i in \$(seq 1 20); do curl -fsS http://127.0.0.1:9000/api/ready && exit 0; sleep 2; done; exit 1"
